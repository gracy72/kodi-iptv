name: Automatyczna aktualizacja IPTV

on:
  schedule:
    # 2:00 UTC = 4:00 czasu polskiego letniego (CEST), 3:00 czasu zimowego (CET)
    - cron: '0 2 * * *'
  workflow_dispatch:      # Pozwala na reczne uruchomienie przyciskiem
  push:
    paths:
      - 'process_playlist.py'          # przebuduj liste, gdy zmieni sie skrypt
      - '.github/workflows/update.yml' # ...albo sam workflow (reczne wznowienie)

jobs:
  auto-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalacja biblioteki aiohttp
        run: pip install aiohttp

      - name: Uruchom skrypt process_playlist.py
        run: python process_playlist.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gracy.m3u gracy_archiwum.m3u
          git commit -m "Automatyczna aktualizacja gracy.m3u [skip ci]" || exit 0
          git push
