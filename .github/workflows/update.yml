name: Automatyczna aktualizacja IPTV

# ZAMROZONE (2026-10-29): aktualizacje wykonuje teraz WYLACZNIE lokalny
# program z polskiego IP (katalog gracy na komputerze uzytkownika), ktory
# wgrywa gracy.m3u i gracy_archiwum.m3u bezposrednio przez API GitHuba.
# Runner GitHuba (IP z USA) nie dociera do geoblokowanych hostow TVP/OVH,
# przez co chmura generowala ubozsza liste. Dlatego usunieto automatyczne
# wyzwalacze (schedule i push). Workflow zostaje tylko jako reczny zapas
# (workflow_dispatch) z zabezpieczeniem przed nadpisaniem pelniejszej listy.

on:
  workflow_dispatch:      # tylko recznie, z przycisku w GitHub

jobs:
  auto-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # pelna historia - do sprawdzenia daty commita gracy.m3u

      - name: Konfiguracja Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalacja biblioteki aiohttp
        run: pip install aiohttp

      - name: Uruchom skrypt process_playlist.py
        run: python process_playlist.py

      - name: Zapisz zmiany w repozytorium
        run: |
          # Zabezpieczenie: nie pozwalamy chmurze nadpisac pelniejszej listy
          # ubozsza - jezeli nowa lista ma mniej kanalow niz ta w repo,
          # przywracamy wersje z repo.
          STARE=$(git show HEAD:gracy.m3u 2>/dev/null | grep -c '^#EXTINF' || echo 0)
          NOWE=$(grep -c '^#EXTINF' gracy.m3u || echo 0)
          echo "kanaly w repo: $STARE, kanaly wygenerowane: $NOWE"
          if [ "$NOWE" -lt "$STARE" ]; then
            echo "Chmura wygenerowala mniej kanalow - przywracam wersje z repo (bez zmiany)"
            git checkout -- gracy.m3u gracy_archiwum.m3u
          fi

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gracy.m3u gracy_archiwum.m3u
          git commit -m "Automatyczna aktualizacja gracy.m3u [skip ci]" || exit 0
          git push
