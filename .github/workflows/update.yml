name: Automatyczna aktualizacja IPTV

on:
  schedule:
    - cron: '0 1 * * *'  # 1:00 UTC = 3:00 rano czasu polskiego (letniego)
  workflow_dispatch:      # Pozwala na ręczne uruchomienie przyciskiem

jobs:
  auto-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalacja biblioteki aiohttp
        run: pip install aiohttp

      - name: Uruchom skrypt process_playlist.py
        run: python process_playlist.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gracy.m3u
          git commit -m "Automatyczna aktualizacja gracy.m3u [skip ci]" || exit 0
          git push
