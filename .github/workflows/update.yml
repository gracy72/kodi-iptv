name: Automatyczna aktualizacja IPTV

# GitHub nie odpala zadan z harmonogramu punktualnie - przy tym repozytorium
# przebiegi cron '0 2 * * *' startowaly ok. 4-7 godzin pozniej (zamiast 4:00
# czasu polskiego wychodzilo 9:00-11:00). Dlatego zamiast jednego sztywnego
# terminu uruchamiamy sie co godzine, a krok "Czy to pora na aktualizacje"
# przepuszcza tylko pierwszy przebieg po 3:00 rano i tylko raz na dobe.
# Efekt: lista odswieza sie rano (najczesciej tuz po 3:00-4:00), niezaleznie
# od tego, jak bardzo GitHub opozni harmonogram.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:      # Pozwala na reczne uruchomienie przyciskiem
  push:
    paths:
      - 'process_playlist.py'          # przebuduj liste, gdy zmieni sie skrypt

jobs:
  auto-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # pelna historia - krok nizej sprawdza date commita gracy.m3u

      - name: Czy to pora na aktualizacje
        id: pora
        if: github.event_name == 'schedule'
        run: |
          export TZ=Europe/Warsaw
          GODZINA=$(date +%-H)    # %-H: bez zera na poczatku (inaczej "08" jest osemkowe)
          DZIS=$(date +%F)
          OSTATNIA=$(git log -1 --format=%cd --date=format:%F -- gracy.m3u)
          echo "godzina lokalna: $GODZINA, dzis: $DZIS, ostatnia aktualizacja gracy.m3u: $OSTATNIA"
          if [ "$GODZINA" -lt 3 ]; then
            echo "przed 3:00 rano - czekam na kolejne uruchomienie"
            echo "czy=nie" >> "$GITHUB_OUTPUT"
          elif [ "$OSTATNIA" = "$DZIS" ]; then
            echo "lista zbudowana juz dzisiaj - pomijam"
            echo "czy=nie" >> "$GITHUB_OUTPUT"
          else
            echo "pora na aktualizacje"
            echo "czy=tak" >> "$GITHUB_OUTPUT"
          fi

      - name: Konfiguracja Python 3.13
        if: github.event_name != 'schedule' || steps.pora.outputs.czy == 'tak'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalacja biblioteki aiohttp
        if: github.event_name != 'schedule' || steps.pora.outputs.czy == 'tak'
        run: pip install aiohttp

      - name: Uruchom skrypt process_playlist.py
        if: github.event_name != 'schedule' || steps.pora.outputs.czy == 'tak'
        run: python process_playlist.py

      - name: Zapisz zmiany w repozytorium
        if: github.event_name != 'schedule' || steps.pora.outputs.czy == 'tak'
        run: |
          # Zabezpieczenie: runner GitHuba (IP z USA) nie dociera do polskich/
          # francuskich hostow OVH (57.128.*, 92.114.85.87), wiec w chmurze czesc
          # dzialajacych kanalow wypada, a martwe sa utrzymywane "bez testu".
          # Nie pozwalamy chmurze nadpisac pelniejszej listy ubozsza - jezeli
          # nowa lista ma mniej kanalow niz ta juz w repo, przywracamy wersje z repo.
          STARE=$(git show HEAD:gracy.m3u 2>/dev/null | grep -c '^#EXTINF' || echo 0)
          NOWE=$(grep -c '^#EXTINF' gracy.m3u || echo 0)
          echo "kanaly w repo: $STARE, kanaly wygenerowane: $NOWE"
          if [ "$NOWE" -lt "$STARE" ]; then
            echo "Chmura wygenerowala mniej kanalow - przywracam wersje z repo (bez zmiany)"
            git checkout -- gracy.m3u gracy_archiwum.m3u
          fi

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gracy.m3u gracy_archiwum.m3u
          git commit -m "Automatyczna aktualizacja gracy.m3u [skip ci]" || exit 0
          git push
