name: Automatyczna aktualizacja IPTV

# Aktualizacje wykonuje GitHub Actions codziennie o 03:00 UTC (04:00 czasu
# polskiego). Reczne uruchomienie: zakladka Actions -> workflow_dispatch.
# Lokalny program (katalog gracy) sluzy tylko do aktualizacji recznej z
# polskiego IP - furtka ratunkowa dla kanalow geoblokowanych z USA.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 04:00 czasu polskiego (zima)
  workflow_dispatch:      # reczne uruchomienie z przycisku w GitHub

jobs:
  auto-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalacja biblioteki aiohttp
        run: pip install aiohttp

      - name: Uruchom skrypt process_playlist.py
        run: python process_playlist.py

      - name: Zapisz zmiany w repozytorium
        run: |
          # Zabezpieczenie: nie nadpisujemy listy, jezeli nowa ma mniej niz
          # 85% kanalow starej (to oznaka awarii zrodel, nie normalnej
          # zmiany). Drobne wahania (kilka kanalow) przechodza normalnie.
          STARE=$(git show HEAD:gracy.m3u 2>/dev/null | grep -c '^#EXTINF' || echo 0)
          NOWE=$(grep -c '^#EXTINF' gracy.m3u || echo 0)
          PROG=$((STARE * 85 / 100))
          echo "kanaly w repo: $STARE, wygenerowane: $NOWE, prog 85%: $PROG"
          if [ "$NOWE" -lt "$PROG" ]; then
            echo "Spadek ponizej 85% - przywracam wersje z repo (bez zmiany)"
            git checkout -- gracy.m3u gracy_archiwum.m3u
          fi

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gracy.m3u gracy_archiwum.m3u
          git commit -m "Automatyczna aktualizacja gracy.m3u [skip ci]" || exit 0
          git push
