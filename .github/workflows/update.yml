name: Automatyczna aktualizacja IPTV

on:
  schedule:
    - cron: '0 3 * * *'  # Uruchamia się codziennie o 3:00 rano
  workflow_dispatch:      # Uruchamianie ręczne

jobs:
  auto-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4.2.2

      - name: Konfiguracja Python 3.13
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13'

      - name: Instalacja wydajnych bibliotek asynchronicznych
        run: pip install aiohttp

      - name: Uruchom skrypt process_playlist.py
        run: python process_playlist.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add wszystkie_dzialajace_kodi.m3u
          git commit -m "Automatyczna aktualizacja playlisty i EPG [skip ci]" || exit 0
          git push
